<style>
/* Layout idea: one narrow column, bottom tab bar, big flame-colored day numeral as the anchor. */
:root{
  --bg:#FAF7EF; --surface:#FFFDF8; --ink:#27291F; --muted:#6A6B5B; --line:#E5DEC9;
  --sky:#E3EEE7; --rock-far:#C9D9CE; --rock:#8DA997; --rock-dark:#5E7C6A; --cloud:#FFFFFF;
  --flame:#3C7A5B; --on-flame:#FFFFFF; --gold:#E8B84A; --hl:rgba(143,200,168,.40); --ok:#2F7A52;
  --display:"Fraunces",Georgia,"Times New Roman",serif;
  --body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1A15; --surface:#16251F; --ink:#EAF2EE; --muted:#A2B8AD; --line:#29403A;
    --sky:#14261E; --rock-far:#25402F; --rock:#4C6F5A; --rock-dark:#304B3C; --cloud:#CFE0D6;
  --flame:#7FCBA2; --on-flame:#07140E; --gold:#EBC25A; --hl:rgba(127,203,162,.28); --ok:#5FD39B;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1A15; --surface:#16251F; --ink:#EAF2EE; --muted:#A2B8AD; --line:#29403A;
  --sky:#14261E; --rock-far:#25402F; --rock:#4C6F5A; --rock-dark:#304B3C; --cloud:#CFE0D6;
  --flame:#7FCBA2; --on-flame:#07140E; --gold:#EBC25A; --hl:rgba(127,203,162,.28); --ok:#5FD39B;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.15}
p{margin:0}
#app{max-width:600px;margin:0 auto;padding:16px 16px 96px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.brand{font-family:var(--display);font-weight:800;font-size:15px;letter-spacing:.02em}
.brand small{display:block;font-family:var(--body);font-weight:500;font-size:12px;color:var(--muted);letter-spacing:0}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--flame)}
.hero{display:flex;gap:14px;align-items:flex-end;margin:6px 0 14px}
.numeral{font-family:var(--display);font-weight:800;font-size:76px;line-height:.85;color:var(--flame);font-variant-numeric:tabular-nums}
.hero h1{font-size:26px}
.mtn{margin:6px 0 4px}
.mtn svg{width:100%;height:auto;display:block}
.m-sky{fill:var(--sky)}
.m-far{fill:var(--rock-far)}
.m-bg{fill:var(--rock)}
.m-shade{fill:var(--rock-dark)}
.m-cloud{fill:var(--cloud);opacity:.85}
.m-trail{fill:none;stroke:var(--ink);stroke-width:2;stroke-dasharray:3 4;opacity:.55}
.m-dot{fill:var(--surface);stroke:var(--ink);stroke-width:1.5}
.m-dot.done{fill:var(--ok);stroke:var(--surface);stroke-width:1.5}
.m-dot.now{fill:var(--flame);stroke:var(--gold);stroke-width:3}
.m-tab{fill:var(--muted);stroke:var(--surface);stroke-width:1}
.m-tab.on{fill:var(--gold)}
.m-glow{fill:var(--gold);opacity:.35}
.m-fire{fill:var(--flame)}
.m-fire2{fill:var(--gold)}
.m-txt{font:700 10px var(--body);fill:var(--ink)}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:6px 0 4px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--flame),var(--gold));border-radius:99px}
.small{font-size:13px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
.card h2{font-size:18px;margin-bottom:8px}
.card h3{font-size:16px;margin-bottom:6px}
.verse{font-family:var(--serif);font-size:19px;line-height:1.55;border-left:4px solid var(--gold);padding-left:14px;margin:10px 0}
.verse cite{display:block;font-family:var(--body);font-style:normal;font-size:13px;color:var(--muted);margin-top:6px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{background:var(--flame);color:var(--on-flame);border:0;border-radius:10px;padding:12px 16px;font-weight:700;cursor:pointer;min-height:44px}
.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.full{width:100%}
.btn[disabled]{opacity:.5;cursor:default}
button:focus-visible,textarea:focus-visible,summary:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.check{display:flex;gap:12px;align-items:center;padding:10px 0;cursor:pointer;min-height:44px}
.check input{width:24px;height:24px;accent-color:var(--flame);flex:none}
textarea{width:100%;min-height:96px;resize:vertical;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:10px 12px;font:inherit;margin-top:8px}
ol.q{padding-left:20px;margin:8px 0}
ol.q li{margin:6px 0}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:5}
.tabs .in{display:flex;width:100%;max-width:600px}
.tabs button{flex:1;background:none;border:0;padding:12px 2px 14px;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer;border-top:3px solid transparent;min-height:52px}
.tabs button[aria-current="page"]{color:var(--flame);border-top-color:var(--flame)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin:10px 0}
.dot{aspect-ratio:1;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;font-weight:700;font-variant-numeric:tabular-nums;cursor:pointer}
.dot.done{background:var(--ok);color:#fff;border-color:var(--ok)}
.dot.now{border:2px solid var(--flame);color:var(--flame)}
.dot.sel{outline:3px solid var(--gold)}
.opt{display:flex;gap:12px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:12px;margin:8px 0;cursor:pointer;background:var(--surface)}
.opt input{width:22px;height:22px;margin-top:2px;accent-color:var(--flame);flex:none}
.opt b{display:block}
.opt.on{border-color:var(--flame)}
details{border-top:1px solid var(--line);padding:10px 0}
details:first-of-type{border-top:0}
summary{font-weight:700;cursor:pointer;min-height:32px}
.reader{font-family:var(--serif);font-size:19px;line-height:1.7}
.reader h2{font-size:22px;margin:22px 0 8px}
.v{cursor:pointer;border-radius:4px;padding:1px 2px}
.v sup{font-family:var(--body);font-size:11px;font-weight:700;color:var(--flame);margin-right:3px}
.v.hl{background:var(--hl)}
.books{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.books button,.chs button{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:left;cursor:pointer;min-height:44px}
.chs{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:10px}
.chs button{text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.celebrate{background:linear-gradient(135deg,var(--flame),#25513B);color:#fff;border:0}
:root[data-theme="dark"] .celebrate{color:#07140E;background:linear-gradient(135deg,var(--flame),var(--gold))}
.note{font-size:13px;color:var(--muted);margin-top:8px}
.lang{display:flex;gap:10px;margin:14px 0}
.lang .btn{flex:1}
@media (prefers-reduced-motion:no-preference){.bar>i{transition:width .4s ease}}
.verse.qt{font-size:18px;border-left-color:var(--flame)}
details.com summary{font-family:var(--display);font-size:18px;font-weight:800}
.com p{margin-top:10px}
.v.speaking{outline:2px solid var(--gold);background:var(--hl)}
.cele{position:fixed;inset:0;z-index:30;background:radial-gradient(ellipse at 50% 28%,#245240 0%,#0E1A15 72%);color:#EAF2EE;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;overflow:auto}
.cele h2{font-size:30px;color:#F5C04A;margin:6px 0 4px}
.cele .eyebrow{color:#F5C04A}
.cele .small{color:#A5ABC9}
.cele .verse{border-left:0;padding:0;text-align:center;max-width:460px;color:#EEF0FA;margin:14px auto 20px}
.cele .verse cite{color:#A5ABC9}
.cele .wax{fill:#EEF0FA;stroke:none}
.cele .wick{stroke:#A5ABC9}
.cdl{width:100%;max-width:340px;margin:14px auto 6px;display:block}
.wax{fill:var(--line);stroke:var(--muted);stroke-width:1}
.wick{stroke:var(--muted);stroke-width:1.5}
.fl1{fill:var(--flame)}
.fl2{fill:var(--gold)}
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:flick 1.7s ease-in-out infinite alternate}
.flame.new{animation:ignite .9s ease-out both,flick 1.7s .9s ease-in-out infinite alternate}
@keyframes flick{from{transform:scale(1,1) rotate(-2deg)}to{transform:scale(.94,1.07) rotate(2deg)}}
@keyframes ignite{from{transform:scale(0)}60%{transform:scale(1.6)}to{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.flame,.flame.new{animation:none}}
.inp{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;margin:4px 0 10px}
.hdr{display:flex;gap:8px;align-items:center}

/* warm, handmade feel */
body{font-size:17px}
h1,h2,h3{font-weight:600;letter-spacing:0}
.brand{font-weight:700;letter-spacing:0}
.eyebrow{text-transform:none;letter-spacing:.02em;font-style:italic;font-weight:600;font-size:14px;font-family:var(--display)}
.numeral{font-weight:500}
.card{border-radius:6px;box-shadow:0 1px 0 var(--line),0 8px 16px -14px rgba(70,55,20,.35)}
.btn{border-radius:6px;font-weight:600}
.pill{border-radius:6px}
.opt,.books button,.chs button,.dot,textarea{border-radius:6px}
.bar>i{background:var(--flame)}
.bar{border-radius:3px}.bar>i{border-radius:3px}
.tabs button{font-weight:600;font-size:13px}
.verse{border-left-width:2px}
.wallnote{border:1px solid var(--line);background:var(--surface);border-radius:2px 8px 4px 8px;padding:14px 16px;margin:10px 0;font-family:var(--serif);font-size:17px;line-height:1.5;box-shadow:0 1px 0 var(--line),0 8px 14px -12px rgba(70,55,20,.35)}
.wallnote .meta{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px;font-family:var(--body)}

var WALL = { loading: false, list: [], mine: [], queue: [], err: "", msg: "" };

  WALL.loading = true; WALL.err = ""; render();
  var jobs = [SB.rpc("wall_list"), SB.rpc("wall_mine"), CLOUD.staff ? SB.rpc("wall_pending") : Promise.resolve({ data: [] })];
  Promise.all(jobs).then(function (r) {
    var bad = r[0].error || r[1].error || r[2].error;

function refreshAccount() { if (UI.screen && UI.screen.type === "account" && CLOUD.user) render(); }
function syncText() {
  if (CLOUD.status === "syncing") return t("syncing");
  if (CLOUD.status === "error") return t("syncErr") + (CLOUD.msg ? ": " + CLOUD.msg : "");
  if (CLOUD.lastSync) { var d = CLOUD.lastSync; return t("syncedAt", { time: ("0" + d.getHours()).slice(-2) + ":" + ("0" + d.getMinutes()).slice(-2) }); }
  return t("syncedNow");
}
function friendly(e) {
  var m = (e && e.message) || "";
  if (/invalid login/i.test(m)) return t("errBad");
  if (/already registered|already been registered/i.test(m)) return t("errExists");
  if (/rate limit|too many/i.test(m)) return t("errRate");
  if (/password/i.test(m) && /character|least|weak|short/i.test(m)) return t("errWeak");
  if (/fetch|network|failed to/i.test(m)) return t("errNet");
  return m || t("errNet");
}
function setAmsg(txt) { var el = document.getElementById("amsg"); if (el) el.textContent = txt; }
function acctSubmit() {
  if (!SB) { setAmsg(t("errNet")); return; }
  var em = (document.getElementById("ae").value || "").trim(), pw = document.getElementById("ap").value || "", up = UI.acctMode === "up";
  UI.acctEmail = em; var wasOn = S.onboarded, nm = up ? (document.getElementById("an").value || "").trim() : "";
  if (up && (!nm || nm.length > 60)) { setAmsg(t("nameReq")); return; }
  if (!/^\S+@\S+\.\S+$/.test(em)) { setAmsg(t("errEmail")); return; }
  if (pw.length < 8) { setAmsg(t("errWeak")); return; }
  if (up && !document.getElementById("ac").checked) { setAmsg(t("errConsent")); return; }
  setAmsg(t("working"));
  var req = up ? SB.auth.signUp({ email: em, password: pw }) : SB.auth.signInWithPassword({ email: em, password: pw });
  req.then(function (r) {
    if (r.error) throw r.error;
    var sess = r.data && r.data.session;
    if (!sess) { setAmsg(t("checkEmail")); return; }
    CLOUD.user = sess.user;
    return (up ? saveProfile(nm, true) : Promise.resolve()).then(pullAndMerge).then(loadProfile).then(function () { fetchCount(); if (!wasOn) { UI.screen = null; UI.tab = "today"; } render(); });
  }).catch(function (e) { setAmsg(friendly(e)); });
}
function acctSignOut() {
  if (!SB) return;
  pushNow().then(function () {
    if (CLOUD.status === "error") return;
    return SB.auth.signOut().then(function () {
      CLOUD.user = null; CLOUD.status = ""; CLOUD.profile = null; CLOUD.staff = false;
      if (S.cloudUser) { resetLocalData(); S.cloudUser = null; }
      saveLocal(); UI.screen = null; UI.tab = "today"; render();
    });
  }).catch(cloudFail);
}
function acctDelete() {
  if (!SB || !CLOUD.user) return;
  if (!UI.confirmDelete) { UI.confirmDelete = true; render(); return; }
  SB.rpc("delete_my_account").then(function (r) {
    if (r.error) throw r.error;
    return SB.auth.signOut();
  }).then(function () {
    CLOUD.user = null; CLOUD.status = ""; CLOUD.profile = null; CLOUD.staff = false; S.cloudUser = null; S.dirty = true; saveLocal(); UI.confirmDelete = false; UI.screen = null; render(); fetchCount();
  }).catch(function (e) { UI.confirmDelete = false; cloudFail(e); });
}
